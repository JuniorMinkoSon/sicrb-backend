# ---------------------------------------------------------------------------
# SICRB — Système d'Information du Conseil Régional de la Bagoué
# ---------------------------------------------------------------------------

quarkus.application.name=sicrb-backend
# 8080 est pris par Apache sur ce poste : on s'installe a cote plutot que
# de disputer un port a un service deja en place.
quarkus.http.port=${SICRB_PORT:8081}

# Toutes les ressources sont montées sous /api : c'est le préfixe que
# l'adaptateur HTTP du frontend attend (VITE_API_BASE_URL).
quarkus.rest.path=/api

# --- Base de données -------------------------------------------------------
# En développement, Quarkus Dev Services démarre un PostgreSQL jetable : rien
# à installer. En production, les variables ci-dessous prennent le relais.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sicrb}
%prod.quarkus.datasource.username=${DB_USER:sicrb}
%prod.quarkus.datasource.password=${DB_PASSWORD:}

# Le schéma est tenu par Flyway, jamais par Hibernate : une migration se relit,
# se rejoue et se versionne, ce qu'un « update » automatique ne permet pas.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# En developpement seulement : la base est jetable et le jeu initial est
# regenere depuis le frontend (npm run seed:sql). Regenerer V2 en change la
# somme de controle, et Flyway refuserait alors de demarrer sur une base deja
# migree. En production, jamais : clean efface les donnees.
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.clean-disabled=false

# --- Frontend --------------------------------------------------------------
# Le site est servi par Vite sur un autre port : sans CORS, le navigateur
# refuse toute réponse. Jamais « * » ici — les requêtes portent une session.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${SICRB_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# --- Documentation ---------------------------------------------------------
quarkus.smallrye-openapi.info-title=API SICRB
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Système d'Information du Conseil Régional de la Bagoué
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/doc

# --- Journalisation --------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."ci.sicrb".level=DEBUG
