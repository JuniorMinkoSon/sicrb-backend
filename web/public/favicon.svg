<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BAGOUÉ 360">
  <!--
    Marque de la plateforme BAGOUÉ 360.

    Le fichier livré avec le gabarit portait un glyphe violet sans rapport avec
    le projet. Celui-ci reprend le bleu institutionnel de l'interface
    (--color-brand-600) et la seule idée que le nom porte : le trois-cent-soixante
    degrés, c'est-à-dire la vue complète — un anneau qui se referme autour du
    territoire.

    Ce n'est pas un emblème officiel du Conseil régional : c'est la marque de
    l'outil. Le sceau de la collectivité, lui, doit venir d'elle.
  -->
  <rect width="64" height="64" rx="14" fill="#1256c4"/>

  <!-- L'anneau : ouvert en bas, comme un cycle qui se poursuit. -->
  <path d="M32 12a20 20 0 1 1-14.14 5.86"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- Le territoire au centre, réduit à sa silhouette. -->
  <path d="M25 31l4-5 6 2 5-4 1 9-5 6-8-1z" fill="#86b9ff"/>

  <!-- Le point de départ du cycle, sur l'ouverture de l'anneau. -->
  <circle cx="17.86" cy="17.86" r="4" fill="#ffffff"/>
</svg>
